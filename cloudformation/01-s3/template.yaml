AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  BucketName:
    Type: String
    Description: Globally unique , lowercase buckect name for S3 bucket
    Default: billnova-assets-v1
  
Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
Outputs:
  BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt S3Bucket.Arn
  BucketRef:
    Description: Reference to the S3 bucket
    Value: !Ref S3Bucket 