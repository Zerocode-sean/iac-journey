AWSTemplateFormatVersion: '2010-09-09'
Description: Simple S3 bucket for learning CloudFormation basics

Resources:
  LearningBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "iac-journey-${AWS::AccountId}-sample"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: iac-journey
        - Key: Purpose
          Value: learning
