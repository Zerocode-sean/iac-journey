Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair

  AvailabilityZone:
    Type: String
    Default: us-east-1a
    AllowedValues:
      - us-east-1a
      - us-east-1b
      - us-east-1c
    Description: Availability zone for the EC2 instance

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for the workload

  InstanceTypeFromSSM:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /ec2/instance-type
    Description: EC2 instance type stored in SSM Parameter Store

Resources:
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      KeyName: !Ref KeyName
      AvailabilityZone: !Ref AvailabilityZone
      InstanceType: !Ref InstanceTypeFromSSM
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'


  MyBucket:
      Type: AWS::S3::Bucket
      Properties:
        AbacStatus: "String"
        AccelerateConfiguration:
          AccelerationStatus: "String"
        AccessControl: "String"
        AnalyticsConfigurations: 
          - Id: "String"
            Prefix: "String"
            StorageClassAnalysis:
              DataExport:
                Destination:
                  BucketAccountId: "String"
                  BucketArn: "String"
                  Format: "String"
                  Prefix: "String"
                OutputSchemaVersion: "String"
            TagFilters:
              - Key: "String"
                Value: "String"
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - BlockedEncryptionTypes:
                EncryptionType:
                  - "String"
              BucketKeyEnabled: false
              ServerSideEncryptionByDefault:
                KMSMasterKeyID: "String"
                SSEAlgorithm: "String"
        BucketName: IaC-Journey-Assets-v1
        BucketNamePrefix: "String"
        BucketNamespace: "String"
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "String"
              AllowedMethods:
                - "String"
              AllowedOrigins:
                - "String"
              ExposedHeaders:
                - "String"
              Id: "String"
              MaxAge: "Number"
        IntelligentTieringConfigurations: 
          - Id: "String"
            Prefix: "String"
            Status: "String"
            TagFilters:
              - Key: "String"
                Value: "String"
            Tierings:
              - AccessTier: "String"
                Days: "Number"
        InventoryConfigurations: 
          - Destination:
              BucketAccountId: "String"
              BucketArn: "String"
              Format: "String"
              Prefix: "String"
            Enabled: false
            Id: "String"
            IncludedObjectVersions: "String"
            OptionalFields:
              - "String"
            Prefix: "String"
            ScheduleFrequency: "String"
        LifecycleConfiguration:
          Rules:
            - AbortIncompleteMultipartUpload:
                DaysAfterInitiation: "Number"
              ExpirationDate: "String"
              ExpirationInDays: "Number"
              ExpiredObjectDeleteMarker: false
              Id: "String"
              NoncurrentVersionExpiration:
                NewerNoncurrentVersions: "Number"
                NoncurrentDays: "Number"
              NoncurrentVersionExpirationInDays: "Number"
              NoncurrentVersionTransition:
                NewerNoncurrentVersions: "Number"
                StorageClass: "String"
                TransitionInDays: "Number"
              NoncurrentVersionTransitions:
                - NewerNoncurrentVersions: "Number"
                  StorageClass: "String"
                  TransitionInDays: "Number"
              ObjectSizeGreaterThan: "String"
              ObjectSizeLessThan: "String"
              Prefix: "String"
              Status: "String"
              TagFilters:
                - Key: "String"
                  Value: "String"
              Transition:
                StorageClass: "String"
                TransitionDate: "String"
                TransitionInDays: "Number"
              Transitions:
                - StorageClass: "String"
                  TransitionDate: "String"
                  TransitionInDays: "Number"
          TransitionDefaultMinimumObjectSize: "String"
        LoggingConfiguration:
          DestinationBucketName: "String"
          LogFilePrefix: "String"
          TargetObjectKeyFormat:
            PartitionedPrefix:
              PartitionDateSource: "String"
            SimplePrefix: "JSON"
        MetadataConfiguration:
          AnnotationTableConfiguration:
            ConfigurationState: "String"
            EncryptionConfiguration:
              KmsKeyArn: "String"
              SseAlgorithm: "String"
            Role: "String"
            TableArn: "String"
            TableName: "String"
          Destination:
            TableBucketArn: "String"
            TableBucketType: "String"
            TableNamespace: "String"
          InventoryTableConfiguration:
            ConfigurationState: "String"
            EncryptionConfiguration:
              KmsKeyArn: "String"
              SseAlgorithm: "String"
            TableArn: "String"
            TableName: "String"
          JournalTableConfiguration:
            EncryptionConfiguration:
              KmsKeyArn: "String"
              SseAlgorithm: "String"
            RecordExpiration:
              Days: "Number"
              Expiration: "String"
            TableArn: "String"
            TableName: "String"
        MetadataTableConfiguration:
          S3TablesDestination:
            TableArn: "String"
            TableBucketArn: "String"
            TableName: "String"
            TableNamespace: "String"
        MetricsConfigurations: 
          - AccessPointArn: "String"
            Id: "String"
            Prefix: "String"
            TagFilters:
              - Key: "String"
                Value: "String"
        NotificationConfiguration:
          EventBridgeConfiguration:
            EventBridgeEnabled: false
          LambdaConfigurations:
            - Event: "String"
              Filter:
                S3Key:
                  Rules:
                    - Name: "String"
                      Value: "String"
              Function: "String"
          QueueConfigurations:
            - Event: "String"
              Filter:
                S3Key:
                  Rules:
                    - Name: "String"
                      Value: "String"
              Queue: "String"
          TopicConfigurations:
            - Event: "String"
              Filter:
                S3Key:
                  Rules:
                    - Name: "String"
                      Value: "String"
              Topic: "String"
        ObjectLockConfiguration:
          ObjectLockEnabled: "String"
          Rule:
            DefaultRetention:
              Days: "Number"
              DefaultEventHold:
                Days: "Number"
                Years: "Number"
              Mode: "String"
              Years: "Number"
        ObjectLockEnabled: false
        OwnershipControls:
          Rules:
            - ObjectOwnership: "String"
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        ReplicationConfiguration:
          Role: "String"
          Rules:
            - DeleteMarkerReplication:
                Status: "String"
              Destination:
                AccessControlTranslation:
                  Owner: "String"
                Account: "String"
                Bucket: "String"
                EncryptionConfiguration:
                  ReplicaKmsKeyID: "String"
                Metrics:
                  EventThreshold:
                    Minutes: "Number"
                  Status: "String"
                ReplicationTime:
                  Status: "String"
                  Time:
                    Minutes: "Number"
                StorageClass: "String"
              Filter:
                And:
                  Prefix: "String"
                  TagFilters:
                    - Key: "String"
                      Value: "String"
                Prefix: "String"
                TagFilter:
                  Key: "String"
                  Value: "String"
              Id: "String"
              Prefix: "String"
              Priority: "Number"
              SourceSelectionCriteria:
                ReplicaModifications:
                  Status: "String"
                SseKmsEncryptedObjects:
                  Status: "String"
              Status: "String"
        Tags: 
          - Key: "String"
            Value: "String"
          - Key: Iac-journey
            Value: Iac-journey-assests-v1
        VersioningConfiguration:
          Status: "String"
        WebsiteConfiguration:
          ErrorDocument: "String"
          IndexDocument: "String"
          RedirectAllRequestsTo:
            HostName: "String"
            Protocol: "String"
          RoutingRules:
            - RedirectRule:
                HostName: "String"
                HttpRedirectCode: "String"
                Protocol: "String"
                ReplaceKeyPrefixWith: "String"
                ReplaceKeyWith: "String"
              RoutingRuleCondition:
                HttpErrorCodeReturnedEquals: "String"
                KeyPrefixEquals: "String"